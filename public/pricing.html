<script>/* PrintQuote pricing engine — pure, deterministic, no DOM, no hard-coded prices.
   Everything it needs comes from the `cfg` object (settings + catalogs). */
(function (root, factory) {
  if (typeof module === 'object' && module.exports) module.exports = factory();
  else root.PQ = factory();
})(typeof self !== 'undefined' ? self : this, function () {
'use strict';

const r2 = x => Math.round((x + Number.EPSILON) * 100) / 100;
const num = (v, d = 0) => { const n = typeof v === 'number' ? v : parseFloat(v); return Number.isFinite(n) ? n : d; };
const has = v => v !== undefined && v !== null && v !== '' && Number.isFinite(typeof v === 'number' ? v : parseFloat(v));
const UNIT_MM = { mm: 1, cm: 10, m: 1000 };

const METHODS = {
  per_item:    { label: 'Per item',            basis: 'item' },
  per_sqm:     { label: 'Per square metre',    basis: 'sqm' },
  per_metre:   { label: 'Per metre',           basis: 'metre' },
  per_sheet:   { label: 'Per sheet',           basis: 'sheet' },
  per_page:    { label: 'Per page',            basis: 'page' },
  per_print:   { label: 'Per print',           basis: 'print' },
  per_garment: { label: 'Per garment',         basis: 'item' },
  fixed:       { label: 'Fixed price',         basis: 'fixed' },
  tiered:      { label: 'Tiered by quantity',  basis: null }
};
const BASES = {
  item: 'per item', print: 'per print', printSqm: 'per m² of print area', sqm: 'per m²',
  sheet: 'per sheet', sheetSide: 'per sheet side', page: 'per page', metre: 'per linear metre', fixed: 'once-off'
};
const FIN_METHODS = {
  fixed: 'Fixed price', per_item: 'Per item', per_metre: 'Per metre', per_sqm: 'Per m²',
  per_page: 'Per page', percent: 'Percentage of direct cost', labour: 'Labour-based'
};

function roundTo(value, rounding) {
  const step = num(rounding && rounding.step, 0);
  if (!(step > 0)) return r2(value);
  const mode = (rounding && rounding.mode) || 'nearest';
  const q = value / step;
  const f = mode === 'up' ? Math.ceil(q - 1e-9) : mode === 'down' ? Math.floor(q + 1e-9) : Math.round(q);
  return r2(f * step);
}

function upsOnSheet(sw, sh, pw, ph, gutter) {
  if (!(sw > 0 && sh > 0 && pw > 0 && ph > 0)) return 1;
  const g = gutter || 0;
  const fit = (aw, ah, bw, bh) => Math.floor((aw + g) / (bw + g)) * Math.floor((ah + g) / (bh + g));
  return Math.max(fit(sw, sh, pw, ph), fit(sw, sh, ph, pw), 0);
}
function sheetCalc(mat, wmm, hmm, qty, leaves, gutter) {
  if (!(mat && mat.sheetW > 0 && mat.sheetH > 0) || !(wmm > 0 && hmm > 0))
    return { sheets: Math.ceil(qty * leaves), ups: 1, tiles: 1 };
  const ups = upsOnSheet(mat.sheetW, mat.sheetH, wmm, hmm, gutter);
  if (ups > 0) return { sheets: Math.ceil(qty * leaves / ups), ups, tiles: 1 };
  const tiles = Math.ceil(wmm / mat.sheetW) * Math.ceil(hmm / mat.sheetH);
  return { sheets: qty * leaves * tiles, ups: 0, tiles };
}

function resolveMarkup(line, prod, cat, S) {
  const P = S.pricing || {};
  if (has(line.markupOverride)) return { pct: num(line.markupOverride), source: 'quote override' };
  if (has(prod.markupPct)) return { pct: num(prod.markupPct), source: 'product' };
  if (cat && has(cat.markupPct)) return { pct: num(cat.markupPct), source: 'category' };
  return { pct: num(P.defaultMarkup, 0), source: 'global default' };
}

function calcLine(line, cfg) {
  const S = cfg.settings || {}, C = S.calc || {}, P = S.pricing || {};
  const res = { ok: false, errors: [], warnings: [], lines: [], groups: {}, info: {}, productionCost: 0, finalSubtotal: 0, calculatedPrice: 0, sellingPrice: 0 };
  const err = m => res.errors.push(m), warn = m => res.warnings.push(m);
  const prod = (cfg.products || {})[line.productId];
  if (!prod) { err('Select a product'); return res; }
  if (prod.active === false) warn('This product is currently disabled');
  const cat = (cfg.categories || {})[prod.category];
  const method = METHODS[prod.method] ? prod.method : 'per_item';

  // ---- validation of raw inputs
  const qty = num(line.qty);
  if (!(qty > 0)) err('Quantity must be greater than zero');
  const intOnly = !['per_sqm', 'per_metre'].includes(method);
  if (qty > 0 && intOnly && !Number.isInteger(qty)) err('Quantity must be a whole number');
  const unit = line.unit || prod.unit || 'mm';
  const k = UNIT_MM[unit] || 1;
  const wIn = has(line.w) ? num(line.w) * k : num(prod.defaultW) * (UNIT_MM[prod.unit || 'mm'] || 1);
  const hIn = has(line.h) ? num(line.h) * k : num(prod.defaultH) * (UNIT_MM[prod.unit || 'mm'] || 1);
  if (wIn < 0 || hIn < 0) err('Width and height cannot be negative');
  const wmm = Math.max(0, wIn), hmm = Math.max(0, hIn);
  const sides = Math.min(2, Math.max(1, Math.round(num(line.sides, num(prod.defaultSides, 1)))));
  const pages = Math.max(1, Math.floor(num(line.pages, num(prod.defaultPages, 1))));
  if (has(line.customCost) && num(line.customCost) < 0) err('Custom cost cannot be negative');
  if (has(line.extraMinutes) && num(line.extraMinutes) < 0) err('Extra labour minutes cannot be negative');
  if (has(line.markupOverride)) {
    const mu = num(line.markupOverride);
    if (mu < 0 || mu > num(P.maxMarkup, 1000)) err('Markup must be between 0% and ' + num(P.maxMarkup, 1000) + '%');
    if (C.markupMode === 'margin' && mu >= 100) err('Margin must be below 100%');
  }

  // ---- resolve components (line may override the primary material)
  const comps = (prod.components || []).map(c => ({ ...c }));
  let primIdx = comps.findIndex(c => c.primary && c.materialId);
  if (primIdx < 0) primIdx = comps.findIndex(c => c.materialId);
  if (primIdx >= 0 && line.materialId) comps[primIdx].materialId = line.materialId;
  const mats = cfg.materials || {};
  const primMat = primIdx >= 0 ? mats[comps[primIdx].materialId] : null;

  // ---- geometry / quantities
  const needsDims = ['large', 'paper'].includes(prod.profile) || ['per_sqm', 'per_metre'].includes(method) ||
    comps.some(c => { const m = c.materialId && mats[c.materialId]; return m && ['sqm', 'metre', 'sheet'].includes(m.costBasis) && !prod.usePrintList; });
  if (needsDims && !(wmm > 0 && hmm > 0)) err('Width and height are required for this product');
  const itemAreaM2 = wmm * hmm / 1e6;
  const totalAreaM2 = itemAreaM2 * qty;
  const lengthM = Math.max(wmm, hmm) / 1000;
  const perimeterM = 2 * (wmm + hmm) / 1000;
  const leaves = pages <= 1 ? 1 : Math.ceil(pages / sides);
  const impressions = pages <= 1 ? sides : pages;

  let printsPerItem = 1, printAreaPerItem = itemAreaM2;
  if (prod.usePrintList) {
    const list = (Array.isArray(line.prints) && line.prints.length ? line.prints : prod.defaultPrints) || [];
    printsPerItem = 0; printAreaPerItem = 0;
    list.forEach((p, i) => {

<script>/* ===== PrintQuote app — core: state, data layer, permissions, helpers ===== */
const $ = (s, r = document) => r.querySelector(s), $$ = (s, r = document) => [...r.querySelectorAll(s)];
const e = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const nf = new Intl.NumberFormat('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const money = v => { const n = PQ.num(v); return (n < 0 ? '-' : '') + 'R' + nf.format(Math.abs(n)); };
const pctf = v => (Math.round(PQ.num(v) * 100) / 100) + '%';
const clean = o => JSON.parse(JSON.stringify(o, (k, v) => (typeof v === 'number' && !isFinite(v)) ? null : v));
const uid = p => p + '_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
const sleep = ms => new Promise(r => setTimeout(r, ms));
const iso = d => d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
const todayISO = () => iso(new Date());
const addDays = (s, n) => { const d = new Date(s + 'T12:00:00'); d.setDate(d.getDate() + n); return iso(d); };
const fmtDate = s => s ? new Date(s.length > 10 ? s : s + 'T12:00:00').toLocaleDateString('en-ZA', { day: '2-digit', month: 'short', year: 'numeric' }) : '';
const fmtTime = ms => new Date(ms).toLocaleString('en-ZA', { day: '2-digit', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' });
const slug = s => String(s || '').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
const KINDS = ['materials', 'machines', 'labour', 'finishing', 'categories', 'products', 'team'];
const STATUSES = [['draft', 'Draft'], ['sent', 'Sent'], ['accepted', 'Accepted'], ['rejected', 'Rejected'], ['expired', 'Expired'], ['converted', 'Converted to Job']];
const statusLabel = s => (STATUSES.find(x => x[0] === s) || [0, s])[1];

const State = {
  mode: 'loading', me: { id: null, name: '', isOwner: false, canEdit: false, canData: null },
  cfg: { settings: null, products: {}, materials: {}, machines: {}, labour: {}, finishing: {}, categories: {}, team: {} },
  quotes: {}, audit: [], jobs: {}, customers: {}, names: {}, loaded: {}, err: null,
  view: 'dashboard', params: {}, previewRole: null, modal: null, dirty: false, qFilter: { text: '', status: '' }, settingsTab: 'business', auditFilter: ''
};
const engineCfg = () => ({ settings: State.cfg.settings || {}, products: State.cfg.products, materials: State.cfg.materials, machines: State.cfg.machines, labour: State.cfg.labour, finishing: State.cfg.finishing, categories: State.cfg.categories });

/* ---------- permissions ---------- */
function role() {
  if (State.previewRole) return State.previewRole;
  if (State.mode === 'memory' || State.me.isOwner) return 'owner';
  const t = State.cfg.team[State.me.id];
  const r = t && t.role ? t.role : ((State.cfg.settings || {}).defaultRole || 'staff');
  return ['owner', 'manager', 'staff'].includes(r) ? r : 'staff';
}
const can = p => PQ.hasPerm(State.cfg.settings || {}, role(), p);
const isOwnerRole = () => role() === 'owner';

/* ---------- data layer (database first; memory fallback) ---------- */
const DB = {
  db: null,
  col(kind) { return this.db.doc('cfg/' + kind).collection('items'); },
  async set(kind, id, data) { data = clean({ ...data, id }); State.cfg[kind][id] = data; if (this.db) await this.col(kind).doc(id).set(data); return data; },
  async del(kind, id) { delete State.cfg[kind][id]; if (this.db) await this.col(kind).doc(id).delete(); },
  async setSettings(s) { State.cfg.settings = clean(s); if (this.db) await this.db.doc('cfg/settings').set(State.cfg.settings); },
  async setQuote(q) { q = clean(q); State.quotes[q.id] = q; if (this.db) await this.db.collection('quotes').doc(q.id).set(q); return q; },
  async delQuote(id) { delete State.quotes[id]; if (this.db) await this.db.collection('quotes').doc(id).delete(); },
  async setCustomer(c) { State.customers[c.id] = c; if (this.db) await this.db.collection('customers').doc(c.id).set(clean(c)); },
  async setJob(j) { State.jobs[j.id] = j; if (this.db) await this.db.collection('jobs').doc(j.id).set(clean(j)); },
  async audit(action, entity, oldV, newV) {

  if (c === 'quota_exceeded') return 'Storage limit reached — delete old records or export and archive first.';

async function nextQuoteNumber() {
  const S = State.cfg.settings, yr = new Date().getFullYear();
  const qid = n => n.replace(/[^A-Za-z0-9_.-]/g, '-');
  if (!DB.db) {
    let seq = PQ.nextSeq(State.localCounter, S, yr);
    while (State.quotes[qid(PQ.formatQuoteNumber(S, yr, seq))]) seq++;
    State.localCounter = { year: yr, seq };
    return PQ.formatQuoteNumber(S, yr, seq);
  }
  const ref = DB.db.doc('counters/quote'), holder = (State.me.id || 'anon') + '-' + Math.random().toString(36).slice(2);
  for (let t = 0; t < 16; t++) {
    const r = await ref.acquire({ holder, ttlMs: 1500 });
    if (!r.acquired) { await sleep(250 + Math.random() * 500); continue; }
    const snap = await ref.get();
    let seq = PQ.nextSeq(snap.exists ? snap.data() : null, S, yr);
    for (let g = 0; g < 200; g++) {
      const n = PQ.formatQuoteNumber(S, yr, seq);
      const ex = await DB.db.doc('quotes/' + qid(n)).get();
      if (!ex.exists && !State.quotes[qid(n)]) break; seq++;
    }
    await ref.set({ year: yr, seq });
    return PQ.formatQuoteNumber(S, yr, seq);
  }
  throw new Error('Could not reserve a quote number — please try again');
}
const quoteDocId = n => n.replace(/[^A-Za-z0-9_.-]/g, '-');

      plan.materials.push({ id: o.id || (ex ? ex.id : uid('mat')), name: o.name, type: o.type || 'other', costBasis: o.costBasis, cost, sheetW: n('sheetW'), sheetH: n('sheetH'), rollWidth: n('rollWidth'), wastagePct: n('wastagePct') || 0, supplier: o.supplier || '', stock: n('stock'), tags: ex ? ex.tags || [] : [], active: true }); }); }
  }
  Imp = { plan, settings, errs };
  const counts = Object.entries(plan).map(([k, arr]) => { const nw = arr.filter(x => !State.cfg[k][x.id]).length; return `<div class="rowline"><span>${KIND_LABEL[k]}s</span><span>${nw} new · ${arr.length - nw} updated</span></div>`; }).join('') + (settings ? '<div class="rowline"><span>Settings</span><span>replace</span></div>' : '');
  openModal({ title: 'Import preview', wide: true, body: `${errs.length ? `<div class="alert bad"><b>${errs.length} problem${errs.length > 1 ? 's' : ''} found — nothing can be imported until fixed.</b><ul>${errs.slice(0, 25).map(x => `<li>${e(x)}</li>`).join('')}</ul>${errs.length > 25 ? '…' : ''}</div>` : '<div class="alert ok">No problems found.</div>'}${counts || '<p class="muted">No records.</p>'}<p class="muted">Existing records with the same id are overwritten. Saved quotes are not affected.</p>`, footer: `<button class="btn" data-act="modal-close">Cancel</button><button class="btn primary" data-act="imp-apply" ${errs.length || !counts ? 'disabled' : ''}>Import</button>` });
}
async function importApply() {
  if (!Imp || Imp.errs.length) return;
  if (!await confirmDialog({ title: 'Apply import?', body: '<p>This overwrites matching records and cannot be undone (export a backup first if unsure).</p>', okLabel: 'Import now' })) return;
  let n = 0; const { plan, settings } = Imp;
  try { for (const k of EXPORT_KINDS) for (const x of plan[k] || []) { await DB.set(k, x.id, { ...x, demo: false }); n++; } if (settings) await DB.setSettings({ ...settings, demo: false }); } catch (er) { toast(explainError(er), 'bad'); return; }
  await DB.audit('Imported configuration', 'Import/Export', '', n + ' records' + (settings ? ' + settings' : '')); Imp = null; closeModal(true); toast('Import complete'); render(true);
}

/* ---------- boot ---------- */
async function boot() {
  State.mode = 'loading'; render();
  const [user, db] = await Promise.all([useCap('user'), useCap('db')]);
  if (user) { try { const m = await user.me(); State.userCap = user; State.me = { id: m.id, name: m.name || '', isOwner: !!m.isOwner, canEdit: !!m.canEdit, canData: await user.can('data.write') }; } catch (er) { /* ignore */ } }
  if (!db) { State.mode = 'memory'; State.loaded.settings = true; State.me.isOwner = true; await seedDemo(); render(true); return; }
  DB.db = db; State.mode = 'db';
  const fail = er => { console.error(er); State.err = 'Database error: ' + ((er && er.message) || er); renderSoon(); };
  db.doc('cfg/settings').onSnapshot(s => { State.cfg.settings = s.exists ? s.data() : null; State.loaded.settings = true; renderSoon(); }, fail);
  KINDS.forEach(k => db.doc('cfg/' + k).collection('items').onSnapshot(qs => { State.cfg[k] = Object.fromEntries(qs.docs.map(d => [d.id, { ...d.data(), id: d.id }])); renderSoon(); }, fail));
  db.collection('quotes').orderBy('createdAt', 'desc').limit(1000).onSnapshot(qs => { State.quotes = Object.fromEntries(qs.docs.map(d => [d.id, d.data()])); renderSoon(); }, fail);
  db.collection('audit').orderBy('ts', 'desc').limit(300).onSnapshot(qs => { State.audit = qs.docs.map(d => ({ ...d.data(), id: d.id })); renderSoon(); }, fail);
  db.collection('jobs').limit(300).onSnapshot(qs => { State.jobs = Object.fromEntries(qs.docs.map(d => [d.id, d.data()])); }, fail);
  db.collection('customers').limit(1000).onSnapshot(qs => { State.customers = Object.fromEntries(qs.docs.map(d => [d.id, d.data()])); }, fail);
}

/* ===== PrintOps bridge for the existing Settings / catalogue / product-wizard screens =====
   UI code is unchanged. Only persistence is redirected: every DB.set/DB.del/DB.setSettings call is sent to the host page,
   which writes it to PostgreSQL (row-level security: owner only) and acknowledges. */
(function () {
  const ORIGIN = window.location.origin;
  const post = (type, payload) => window.parent.postMessage({ source: 'printops-calc', type, payload }, ORIGIN);
  const pending = new Map(); let seq = 0;
  function rpc(op, payload) {
    return new Promise((res, rej) => {
      const id = ++seq; pending.set(id, { res, rej }); post('persist', { rid: id, op, ...payload });
      setTimeout(() => { if (pending.has(id)) { pending.delete(id); rej(new Error('Timed out — nothing was saved. Please try again.')); } }, 25000);
    });
  }
  window.addEventListener('message', ev => {
    if (ev.origin !== ORIGIN) return; const m = ev.data; if (!m || m.source !== 'printops-host') return;
    if (m.type === 'init') init(m.payload);
    else if (m.type === 'ack') { const p = pending.get(m.payload.rid); if (!p) return; pending.delete(m.payload.rid); m.payload.ok ? p.res() : p.rej(new Error(m.payload.error || 'Could not save')); }
  });
  DB.set = async (kind, id, data) => { data = clean({ ...data, id }); await rpc('set', { kind, id, data }); State.cfg[kind][id] = data; return data; };
  DB.del = async (kind, id) => { await rpc('del', { kind, id }); delete State.cfg[kind][id]; };
  DB.setSettings = async s => { s = clean(s); await rpc('settings', { data: { demo: !!s.demo, pricing: s.pricing, calc: s.calc, vat: s.vat, discount: s.discount } }); State.cfg.settings = s; };
  DB.audit = async () => { /* the database records every configuration change itself (config_audit) */ };
  explainError = function (er) { return (er && er.message) || 'Could not save'; };
  settingsTabs = function () { return [['pricing', 'Pricing'], ['vat', 'VAT'], ['discounts', 'Discounts'], ['products', 'Products'], ['materials', 'Materials'], ['labour', 'Labour'], ['machines', 'Machines'], ['finishing', 'Finishing'], ['dtf', 'DTF'], ['paper', 'Paper'], ['large', 'Large format']]; };
  function init(p) {
    State.mode = 'embedded'; State.me = { id: p.userId, name: p.userName, isOwner: true, canEdit: true, canData: true };
    State.cfg.settings = p.settings;
    ['products', 'materials', 'machines', 'labour', 'finishing', 'categories'].forEach(k => { State.cfg[k] = p[k] || {}; });
    State.loaded.settings = true; State.embedded = true; State.audit = []; document.body.classList.add('embedded');
    State.view = 'settings'; State.settingsTab = 'products'; render(true);
  }
  if (window.ResizeObserver) new ResizeObserver(() => post('height', document.documentElement.scrollHeight)).observe(document.body);
  post('ready', true);
})();
