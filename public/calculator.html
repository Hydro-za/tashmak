<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Quote calculator</title>
<style>:root{--bg:#f3f6f7;--card:#fff;--ink:#12181b;--muted:#63707a;--line:#e1e7ea;--soft:#edf2f4;--accent:#04767b;--accent-ink:#fff;--accent-strong:#035459;--accent-soft:#e0f2f2;--ok:#17803f;--ok-bg:#e4f4ea;--warn:#9a6500;--warn-bg:#fff3d4;--bad:#b3261e;--bad-bg:#fde8e6;--info:#1d5fbf;--info-bg:#e7f0fc;--shadow:0 1px 2px rgba(16,24,40,.05),0 6px 18px rgba(16,24,40,.05);--r:14px;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d1214;--card:#151b1e;--ink:#edf2f3;--muted:#8fa0a7;--line:#242f34;--soft:#1c2529;--accent:#2fb5ba;--accent-ink:#04191a;--accent-strong:#63d3d7;--accent-soft:#11373a;--ok:#5bd28f;--ok-bg:#112a1c;--warn:#f0c04d;--warn-bg:#2d2410;--bad:#ff8a80;--bad-bg:#2f1715;--info:#7aa8ff;--info-bg:#15223a;--shadow:0 1px 2px rgba(0,0,0,.4);--r:14px;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0d1214;--card:#151b1e;--ink:#edf2f3;--muted:#8fa0a7;--line:#242f34;--soft:#1c2529;--accent:#2fb5ba;--accent-ink:#04191a;--accent-strong:#63d3d7;--accent-soft:#11373a;--ok:#5bd28f;--ok-bg:#112a1c;--warn:#f0c04d;--warn-bg:#2d2410;--bad:#ff8a80;--bad-bg:#2f1715;--info:#7aa8ff;--info-bg:#15223a;--shadow:0 1px 2px rgba(0,0,0,.4);--r:14px;color-scheme:dark}
:root[data-theme="light"]{color-scheme:light}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
h1,h2,h3{margin:0;letter-spacing:-.01em}h1{font-size:22px}h2{font-size:16px}h3{font-size:14px}
button,input,select,textarea{font:inherit;color:inherit}
a{color:inherit}
.app{display:flex;min-height:100vh}
.side{width:212px;flex:none;background:var(--card);border-right:1px solid var(--line);padding:16px 10px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:2px}
.brand{font-weight:700;font-size:15px;padding:4px 10px 14px;display:flex;align-items:center;gap:8px}
.nav a,.nav button{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:none;border:0;padding:9px 10px;border-radius:8px;cursor:pointer;color:var(--muted);text-decoration:none;font-weight:500}
.nav a:hover,.nav button:hover{background:var(--soft);color:var(--ink)}
.nav .on{background:var(--accent);color:var(--accent-ink)}
.nav svg{width:18px;height:18px;flex:none}
.who{margin-top:auto;padding:10px;font-size:12px;color:var(--muted);border-top:1px solid var(--line)}
.main{flex:1;min-width:0;padding:22px 26px 90px;max-width:1280px;margin:0 auto;width:100%}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px;flex-wrap:wrap}
.top .actions{display:flex;gap:8px;flex-wrap:wrap}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;box-shadow:var(--shadow);margin-bottom:14px}
.card>h2,.card>.hd{margin-bottom:12px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.grid{display:grid;gap:12px}.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:14px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px}
.stat .k{font-size:12px;color:var(--muted)}.stat .v{font-size:22px;font-weight:700;margin-top:2px;letter-spacing:-.02em}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field label,.lbl{font-size:12px;color:var(--muted);font-weight:500}
.field .help{font-size:11.5px;color:var(--muted)}
input[type=text],input[type=number],input[type=date],input[type=email],input[type=tel],input[type=search],input:not([type]),select,textarea{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:var(--card);min-height:38px}
input:focus,select:focus,textarea:focus{outline:2px solid var(--ink);outline-offset:-1px}
input.bad,select.bad,textarea.bad{border-color:var(--bad);background:var(--bad-bg)}
input[type=checkbox]{width:17px;height:17px;accent-color:var(--ink)}
textarea{resize:vertical;min-height:70px}
.chk{display:flex;gap:8px;align-items:center;font-size:13.5px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:9px 14px;border-radius:8px;border:1px solid var(--line);background:var(--card);cursor:pointer;font-weight:600;min-height:38px;white-space:nowrap}
.btn:hover{background:var(--soft)}.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}.btn.primary:hover{opacity:.88}
.btn.danger{color:var(--bad);border-color:var(--bad)}.btn.danger.solid{background:var(--bad);color:#fff}
.btn.sm{padding:5px 10px;min-height:30px;font-size:12.5px}.btn.ghost{border-color:transparent;background:transparent}.btn.ghost:hover{background:var(--soft)}
.btn.icon{padding:0;width:34px;min-height:34px}
.badge{display:inline-block;padding:2px 8px;border-radius:99px;font-size:11.5px;font-weight:600;background:var(--soft);color:var(--muted);white-space:nowrap}
.b-draft{background:var(--soft)}.b-sent{background:var(--info-bg);color:var(--info)}.b-accepted{background:var(--ok-bg);color:var(--ok)}.b-rejected{background:var(--bad-bg);color:var(--bad)}.b-expired{background:var(--warn-bg);color:var(--warn)}.b-converted{background:var(--accent);color:var(--accent-ink)}.b-demo{background:var(--warn-bg);color:var(--warn)}
.tblwrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
table.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{text-align:left;font-size:11.5px;color:var(--muted);font-weight:600;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}.tbl tr.click{cursor:pointer}.tbl tr.click:hover td{background:var(--soft)}
.tbl .r,.r{text-align:right;font-variant-numeric:tabular-nums}.tbl .muted,.muted{color:var(--muted)}
.tabs{display:flex;gap:4px;overflow-x:auto;padding-bottom:2px;margin-bottom:14px;border-bottom:1px solid var(--line);-webkit-overflow-scrolling:touch}
.tabs button{background:none;border:0;padding:9px 12px;cursor:pointer;color:var(--muted);font-weight:600;white-space:nowrap;border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs button.on{color:var(--ink);border-bottom-color:var(--ink)}
.alert{padding:10px 12px;border-radius:8px;font-size:13px;margin-bottom:10px}
.alert.warn{background:var(--warn-bg);color:var(--warn)}.alert.bad{background:var(--bad-bg);color:var(--bad)}.alert.info{background:var(--info-bg);color:var(--info)}.alert.ok{background:var(--ok-bg);color:var(--ok)}
.split{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:16px;align-items:start}
.sticky{position:sticky;top:14px}
.item{border:1px solid var(--line);border-radius:12px;background:var(--card);margin-bottom:12px;overflow:hidden}
.item>.ih{display:flex;align-items:center;gap:10px;padding:12px 14px;cursor:pointer;background:var(--soft)}
.item>.ih .t{flex:1;min-width:0;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.item>.ih .p{font-weight:700;font-variant-numeric:tabular-nums}
.item>.ib{padding:14px;display:block}.item.closed>.ib{display:none}
.qty{display:flex;gap:6px}.qty input{text-align:center;min-width:64px}.qty .btn{min-width:42px;padding:0}
.rowline{display:flex;justify-content:space-between;gap:12px;padding:5px 0;font-variant-numeric:tabular-nums}
.rowline.tot{font-weight:700;font-size:17px;border-top:1px solid var(--line);margin-top:6px;padding-top:10px}
.rowline.sub{color:var(--muted);font-size:13px}
details.calc{border:1px dashed var(--line);border-radius:8px;padding:8px 10px;margin-top:10px}
details.calc summary{cursor:pointer;font-weight:600;font-size:13px}
.pillrow{display:flex;gap:6px;flex-wrap:wrap}
.pill{border:1px solid var(--line);border-radius:99px;padding:4px 10px;font-size:12.5px;background:var(--card);cursor:pointer}
.pill.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.fin{display:grid;grid-template-columns:auto 1fr auto;gap:8px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line)}
.fin:last-child{border:0}.fin input[type=number]{width:80px}
.metric{background:var(--soft);border-radius:8px;padding:10px}.metric .k{font-size:11.5px;color:var(--muted)}.metric .v{font-weight:700;font-size:16px}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:50;display:flex;align-items:center;justify-content:center;padding:14px}
.modal{background:var(--card);border-radius:14px;width:100%;max-width:560px;max-height:calc(100vh - 28px);display:flex;flex-direction:column;box-shadow:0 20px 60px rgba(0,0,0,.35)}
.modal.wide{max-width:920px}.modal>.mh{padding:14px 18px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:10px}
.modal>.mb{padding:16px 18px;overflow:auto;flex:1}.modal>.mf{padding:12px 18px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(88px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;z-index:80;font-weight:600;max-width:92vw;box-shadow:0 8px 30px rgba(0,0,0,.3)}
.toast.bad{background:var(--bad);color:#fff}
.steps{display:flex;gap:4px;margin-bottom:14px;overflow-x:auto}.steps button{flex:1;min-width:70px;border:0;border-top:3px solid var(--line);background:none;padding:6px 2px;font-size:11.5px;color:var(--muted);cursor:pointer;font-weight:600}.steps button.on{border-color:var(--ink);color:var(--ink)}.steps button.done{border-color:var(--ok)}
.listrow{display:grid;gap:8px;grid-template-columns:2fr 1fr 1fr auto;align-items:end;padding:8px;border:1px solid var(--line);border-radius:8px;margin-bottom:8px}
.diff{display:grid;grid-template-columns:1fr auto auto auto;gap:8px;padding:6px 0;border-bottom:1px solid var(--line);align-items:center}
.old{color:var(--bad);text-decoration:line-through}.new{color:var(--ok);font-weight:700}
.bottom{display:none}
.stickybar{display:none}
/* quote document */
.qdoc{background:#fff;color:#111;border:1px solid var(--line);border-radius:12px;padding:34px;max-width:860px;margin:0 auto;box-shadow:var(--shadow)}
.qdoc h1{font-size:26px;margin-bottom:2px}.qdoc .hdr{display:flex;justify-content:space-between;gap:20px;align-items:flex-start;margin-bottom:22px;flex-wrap:wrap}
.qdoc img.logo{max-height:64px;max-width:220px;object-fit:contain;margin-bottom:6px}
.qdoc table{width:100%;border-collapse:collapse;font-size:13px;margin:14px 0}.qdoc th{background:#111;color:#fff;text-align:left;padding:8px 10px;font-size:12px}.qdoc td{padding:9px 10px;border-bottom:1px solid #e3e3df;vertical-align:top}
.qdoc .r{text-align:right}.qdoc .tot{margin-left:auto;width:min(340px,100%)}.qdoc .tot div{display:flex;justify-content:space-between;padding:4px 0}.qdoc .tot .g{font-weight:700;font-size:17px;border-top:2px solid #111;margin-top:6px;padding-top:8px}
.qdoc .small{font-size:12px;color:#555;white-space:pre-wrap}.qdoc .cols{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.setup{max-width:560px;margin:8vh auto;text-align:center}
@media (max-width:1000px){.split{grid-template-columns:1fr}.sticky{position:static}.stats{grid-template-columns:repeat(2,minmax(0,1fr))}.g3,.g4{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:820px){
 .side{display:none}.main{padding:14px 12px 150px}
 .bottom{display:flex;position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);z-index:40;padding:4px 4px calc(4px + env(safe-area-inset-bottom,0px))}
 .bottom button{flex:1;background:none;border:0;padding:6px 2px;font-size:10.5px;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px;font-weight:600;cursor:pointer}.bottom button.on{color:var(--ink)}.bottom svg{width:21px;height:21px}
 .g2,.g3,.g4{grid-template-columns:1fr}.listrow{grid-template-columns:1fr 1fr}
 .btn{min-height:44px}.btn.sm{min-height:36px}input,select,textarea{min-height:44px;font-size:16px}
 .stickybar{display:flex;position:fixed;left:0;right:0;bottom:calc(56px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);z-index:39;padding:10px 14px;justify-content:space-between;align-items:center;gap:10px;font-weight:700}
 .stickybar small{display:block;font-weight:500;opacity:.75}
 .qdoc{padding:18px}.qdoc .cols{grid-template-columns:1fr}
 .modal{max-height:calc(100vh - 20px)}.overlay{padding:8px;align-items:flex-end}.modal{border-radius:14px 14px 0 0}
 .toast{bottom:calc(150px + env(safe-area-inset-bottom,0px))}
 .item>.ib{padding:12px}.stats .v{font-size:18px}
}
@media print{
 body{background:#fff}.side,.bottom,.stickybar,.top,.noprint,.toast,.overlay{display:none!important}
 .main{padding:0;max-width:none}.qdoc{border:0;box-shadow:none;padding:0;max-width:none}
 :root{padding:0}
}

 body.embedded .listrow{grid-template-columns:1fr 1fr}

<script>/* PrintQuote pricing engine — pure, deterministic, no DOM, no hard-coded prices.
   Everything it needs comes from the `cfg` object (settings + catalogs). */
(function (root, factory) {
  if (typeof module === 'object' && module.exports) module.exports = factory();
  else root.PQ = factory();
})(typeof self !== 'undefined' ? self : this, function () {
'use strict';

const r2 = x => Math.round((x + Number.EPSILON) * 100) / 100;
const num = (v, d = 0) => { const n = typeof v === 'number' ? v : parseFloat(v); return Number.isFinite(n) ? n : d; };
const has = v => v !== undefined && v !== null && v !== '' && Number.isFinite(typeof v === 'number' ? v : parseFloat(v));
const UNIT_MM = { mm: 1, cm: 10, m: 1000 };

const METHODS = {
  per_item:    { label: 'Per item',            basis: 'item' },
  per_sqm:     { label: 'Per square metre',    basis: 'sqm' },
  per_metre:   { label: 'Per metre',           basis: 'metre' },
  per_sheet:   { label: 'Per sheet',           basis: 'sheet' },
  per_page:    { label: 'Per page',            basis: 'page' },
  per_print:   { label: 'Per print',           basis: 'print' },
  per_garment: { label: 'Per garment',         basis: 'item' },
  fixed:       { label: 'Fixed price',         basis: 'fixed' },
  tiered:      { label: 'Tiered by quantity',  basis: null }
};
const BASES = {
  item: 'per item', print: 'per print', printSqm: 'per m² of print area', sqm: 'per m²',
  sheet: 'per sheet', sheetSide: 'per sheet side', page: 'per page', metre: 'per linear metre', fixed: 'once-off'
};
const FIN_METHODS = {
  fixed: 'Fixed price', per_item: 'Per item', per_metre: 'Per metre', per_sqm: 'Per m²',
  per_page: 'Per page', percent: 'Percentage of direct cost', labour: 'Labour-based'
};

function roundTo(value, rounding) {
  const step = num(rounding && rounding.step, 0);
  if (!(step > 0)) return r2(value);
  const mode = (rounding && rounding.mode) || 'nearest';
  const q = value / step;
  const f = mode === 'up' ? Math.ceil(q - 1e-9) : mode === 'down' ? Math.floor(q + 1e-9) : Math.round(q);
  return r2(f * step);
}

function upsOnSheet(sw, sh, pw, ph, gutter) {
  if (!(sw > 0 && sh > 0 && pw > 0 && ph > 0)) return 1;
  const g = gutter || 0;
  const fit = (aw, ah, bw, bh) => Math.floor((aw + g) / (bw + g)) * Math.floor((ah + g) / (bh + g));
  return Math.max(fit(sw, sh, pw, ph), fit(sw, sh, ph, pw), 0);
}
function sheetCalc(mat, wmm, hmm, qty, leaves, gutter) {
  if (!(mat && mat.sheetW > 0 && mat.sheetH > 0) || !(wmm > 0 && hmm > 0))
    return { sheets: Math.ceil(qty * leaves), ups: 1, tiles: 1 };
  const ups = upsOnSheet(mat.sheetW, mat.sheetH, wmm, hmm, gutter);
  if (ups > 0) return { sheets: Math.ceil(qty * leaves / ups), ups, tiles: 1 };
  const tiles = Math.ceil(wmm / mat.sheetW) * Math.ceil(hmm / mat.sheetH);
  return { sheets: qty * leaves * tiles, ups: 0, tiles };
}

function resolveMarkup(line, prod, cat, S) {
  const P = S.pricing || {};
  if (has(line.markupOverride)) return { pct: num(line.markupOverride), source: 'quote override' };
  if (has(prod.markupPct)) return { pct: num(prod.markupPct), source: 'product' };
  if (cat && has(cat.markupPct)) return { pct: num(cat.markupPct), source: 'category' };
  return { pct: num(P.defaultMarkup, 0), source: 'global default' };
}

function calcLine(line, cfg) {
  const S = cfg.settings || {}, C = S.calc || {}, P = S.pricing || {};
  const res = { ok: false, errors: [], warnings: [], lines: [], groups: {}, info: {}, productionCost: 0, finalSubtotal: 0, calculatedPrice: 0, sellingPrice: 0 };
  const err = m => res.errors.push(m), warn = m => res.warnings.push(m);
  const prod = (cfg.products || {})[line.productId];
  if (!prod) { err('Select a product'); return res; }
  if (prod.active === false) warn('This product is currently disabled');
  const cat = (cfg.categories || {})[prod.category];
  const method = METHODS[prod.method] ? prod.method : 'per_item';

  // ---- validation of raw inputs
  const qty = num(line.qty);
  if (!(qty > 0)) err('Quantity must be greater than zero');
  const intOnly = !['per_sqm', 'per_metre'].includes(method);
  if (qty > 0 && intOnly && !Number.isInteger(qty)) err('Quantity must be a whole number');
  const unit = line.unit || prod.unit || 'mm';
  const k = UNIT_MM[unit] || 1;
  const wIn = has(line.w) ? num(line.w) * k : num(prod.defaultW) * (UNIT_MM[prod.unit || 'mm'] || 1);
  const hIn = has(line.h) ? num(line.h) * k : num(prod.defaultH) * (UNIT_MM[prod.unit || 'mm'] || 1);
  if (wIn < 0 || hIn < 0) err('Width and height cannot be negative');
  const wmm = Math.max(0, wIn), hmm = Math.max(0, hIn);
  const sides = Math.min(2, Math.max(1, Math.round(num(line.sides, num(prod.defaultSides, 1)))));
  const pages = Math.max(1, Math.floor(num(line.pages, num(prod.defaultPages, 1))));
  if (has(line.customCost) && num(line.customCost) < 0) err('Custom cost cannot be negative');
  if (has(line.designFee) && num(line.designFee) < 0) err('Design fee cannot be negative');
  if (has(line.extraMinutes) && num(line.extraMinutes) < 0) err('Extra labour minutes cannot be negative');
  if (has(line.markupOverride)) {
    const mu = num(line.markupOverride);
    if (mu < 0 || mu > num(P.maxMarkup, 1000)) err('Markup must be between 0% and ' + num(P.maxMarkup, 1000) + '%');
    if (C.markupMode === 'margin' && mu >= 100) err('Margin must be below 100%');
  }

  // ---- resolve components (line may override the primary material)
  const comps = (prod.components || []).map(c => ({ ...c }));
  let primIdx = comps.findIndex(c => c.primary && c.materialId);
  if (primIdx < 0) primIdx = comps.findIndex(c => c.materialId);
  if (primIdx >= 0 && line.materialId) comps[primIdx].materialId = line.materialId;
  const mats = cfg.materials || {};
  const primMat = primIdx >= 0 ? mats[comps[primIdx].materialId] : null;

  // ---- geometry / quantities
  const needsDims = ['large', 'paper'].includes(prod.profile) || ['per_sqm', 'per_metre'].includes(method) ||
    comps.some(c => { const m = c.materialId && mats[c.materialId]; return m && ['sqm', 'metre', 'sheet'].includes(m.costBasis) && !prod.usePrintList; });
  if (needsDims && !(wmm > 0 && hmm > 0)) err('Width and height are required for this product');
  const itemAreaM2 = wmm * hmm / 1e6;
  const totalAreaM2 = itemAreaM2 * qty;
  const lengthM = Math.max(wmm, hmm) / 1000;
  const perimeterM = 2 * (wmm + hmm) / 1000;
  const leaves = pages <= 1 ? 1 : Math.ceil(pages / sides);
  const impressions = pages <= 1 ? sides : pages;

  let printsPerItem = 1, printAreaPerItem = itemAreaM2;
  if (prod.usePrintList) {
    const list = (Array.isArray(line.prints) && line.prints.length ? line.prints : prod.defaultPrints) || [];
    printsPerItem = 0; printAreaPerItem = 0;
    list.forEach((p, i) => {
      const pw = num(p.w), ph = num(p.h), pc = num(p.count, 1);
      if (pw <= 0 || ph <= 0) err('Print ' + (i + 1) + ': width and height must be greater than zero');
      if (pc < 1 || !Number.isInteger(pc)) err('Print ' + (i + 1) + ': count must be a whole number of 1 or more');
      printsPerItem += pc; printAreaPerItem += pw * ph / 10000 * pc;
    });
    if (!list.length) err('Add at least one print position');
  }
  const gutter = has(prod.gutterMm) ? num(prod.gutterMm) : num(C.gutterMm, 3);
  const primSheet = sheetCalc(primMat && primMat.costBasis === 'sheet' ? primMat : null, wmm, hmm, qty, leaves, gutter);
  if (primMat && primMat.costBasis === 'sheet' && primSheet.ups === 0)
    warn('Finished size is larger than the sheet; sheets are tiled');

  const areaForMat = prod.usePrintList ? printAreaPerItem * qty : totalAreaM2;
  const B = {
    item: qty, print: qty * printsPerItem, printSqm: printAreaPerItem * qty, sqm: totalAreaM2,
    sheet: primSheet.sheets, sheetSide: primSheet.sheets * sides, page: qty * pages, metre: qty * lengthM, fixed: 1
  };
  const tierQtyBasis = prod.tierBasis || 'item';
  res.info = {
    qty, unit, widthMm: wmm, heightMm: hmm, itemAreaM2: itemAreaM2, totalAreaM2, perimeterM, lengthM,
    sides, pages, leaves, impressions, printsPerItem, printAreaPerItemM2: printAreaPerItem,
    printAreaPerItemCm2: printAreaPerItem * 10000, totalPrints: B.print, totalPrintAreaM2: B.printSqm,
    sheets: primSheet.sheets, upsPerSheet: primSheet.ups, filmMetres: 0
  };

  const add = (group, label, detail, amount) => {
    amount = r2(amount);
    if (amount === 0 && group !== 'base') return;
    res.lines.push({ group, label, detail, amount });
  };
  const money = v => 'R' + r2(v).toFixed(2);
  const fmtN = v => (Math.round(v * 1000) / 1000).toString();

  // ---- 1. base price (method / tiers)
  let baseSell = null;
  const units = method === 'tiered' ? B[tierQtyBasis] : B[METHODS[method].basis];
  let basePrice = num(prod.basePrice), tierNote = '';
  if (method === 'tiered' || (prod.tiers && prod.tiers.length && method !== 'fixed')) {
    const tiers = (prod.tiers || []).slice().sort((a, b) => num(a.from) - num(b.from));
    if (!tiers.length) { if (method === 'tiered') err('This tiered product has no tiers configured'); }
    else {
      const tq = B[tierQtyBasis];
      let t = tiers[0]; tiers.forEach(x => { if (tq >= num(x.from)) t = x; });
      basePrice = num(t.price);
      const next = tiers.find(x => num(x.from) > num(t.from));
      tierNote = ' (tier ' + num(t.from) + (next ? '–' + (num(next.from) - 1) : '+') + ')';
      res.info.tier = { from: num(t.from), price: num(t.price) };
    }
  }
  if (basePrice > 0 || (prod.baseIsSell && method !== 'per_item')) {
    const label = METHODS[method].label + ' base price' + tierNote;
    if (prod.baseIsSell) {
      // base price is a SELLING price that covers materials, print, machines & labour;
      // finishing and custom costs are marked up and added on top.
      baseSell = r2(basePrice * units);
      add('base', label, fmtN(units) + ' × ' + money(basePrice) + ' sell price — covers materials, printing, machines & labour (no markup)', 0);
    } else {
      add('base', label, fmtN(units) + ' × ' + money(basePrice), basePrice * units);
    }
  }
  if (num(prod.setupFee) > 0) add('other', 'Setup fee', 'once-off', num(prod.setupFee));

  // ---- 2. components (materials & other costs)
  comps.forEach(c => {
    const grp = c.group || 'material';
    if (c.materialId) {
      const m = mats[c.materialId];
      if (!m) { err('Material no longer exists (' + (c.label || c.materialId) + ')'); return; }
      if (m.active === false) warn('Material "' + m.name + '" is disabled');
      let usage = 0, u = '';
      if (m.costBasis === 'sheet') { usage = c === comps[primIdx] ? primSheet.sheets : sheetCalc(m, wmm, hmm, qty, leaves, gutter).sheets; u = 'sheets'; }
      else if (m.costBasis === 'sqm') { usage = areaForMat; u = 'm²'; }
      else if (m.costBasis === 'metre') {
        const rw = num(m.rollWidth) / 1000;
        if (!(rw > 0)) { err('Roll width missing for material "' + m.name + '"'); return; }
        usage = areaForMat / rw; u = 'm';
        if (!prod.usePrintList && Math.min(wmm, hmm) / 1000 > rw + 1e-9) warn('Smaller side is wider than the ' + m.rollWidth + 'mm roll of "' + m.name + '"');
        if (prod.usePrintList) res.info.filmMetres += usage;
      } else { usage = num(c.qtyPer, 1) * B[c.perBasis || 'item']; u = m.costBasis === 'kg' ? 'kg' : 'units'; }
      const amt = usage * num(m.cost);
      add(grp, c.label || m.name, fmtN(usage) + ' ' + u + ' × ' + money(m.cost) + ' (' + m.name + ')', amt);
      if (num(m.wastagePct) > 0) add('wastage', m.name + ' material wastage', num(m.wastagePct) + '% of ' + money(amt), amt * num(m.wastagePct) / 100);
      if (has(m.stock) && num(m.stock) > 0 && usage > num(m.stock)) warn('Low stock: "' + m.name + '" needs ' + fmtN(usage) + ' ' + u + ', ' + m.stock + ' available');
    } else {
      const q = B[c.basis || 'item'];
      add(grp, c.label || 'Cost', fmtN(q) + ' ' + (BASES[c.basis || 'item'] || '') + ' × ' + money(c.rate), num(c.rate) * q);
    }
  });

  // ---- 3. print cost
  const pr = prod.print;
  const printBasisKey = (pr && pr.basis) || 'print';
  if (pr && num(pr.rate) > 0) {
    let rate = num(pr.rate);
    const bw = line.colour === 'bw';
    if (bw && has(pr.bwFactor)) rate *= num(pr.bwFactor);
    const q = printBasisKey === 'sqm' ? areaForMat : printBasisKey === 'printSqm' ? B.printSqm : B[printBasisKey];
    add('print', pr.label || 'Printing', fmtN(q) + ' ' + (BASES[printBasisKey] || '') + ' × ' + money(rate) + (bw ? ' (B&W)' : ''), rate * q);
  }
  const printQty = printBasisKey === 'sqm' ? areaForMat : printBasisKey === 'printSqm' ? B.printSqm : B[printBasisKey];

  // ---- 4. machines
  if (C.includeMachine !== false) (prod.machines || []).forEach(pm => {
    const m = (cfg.machines || {})[pm.machineId];
    if (!m) { if (pm.machineId) err('Machine no longer exists'); return; }
    if (m.active === false) warn('Machine "' + m.name + '" is disabled');
    const hrs = (num(pm.minutesPerUnit) * B[pm.unitBasis || 'item'] + num(pm.fixedMinutes)) / 60;
    const parts = [];
    let amt = 0;
    const s = num(m.setupCost); if (s > 0) { amt += s; parts.push('setup ' + money(s)); }
    const pp = num(m.costPerPrint) * printQty; if (pp > 0) { amt += pp; parts.push(fmtN(printQty) + ' prints × ' + money(m.costPerPrint)); }
    const ps = num(m.costPerSqm) * areaForMat; if (ps > 0) { amt += ps; parts.push(fmtN(areaForMat) + ' m² × ' + money(m.costPerSqm)); }
    const hr = num(m.costPerHour) + num(m.maintenancePerHour) + num(m.depreciationPerHour);
    if (hrs > 0 && hr > 0) { amt += hrs * hr; parts.push(fmtN(hrs) + ' h × ' + money(hr)); }
    add('machine', m.name, parts.join(' + '), amt);
  });

  // ---- 5. labour
  const labCost = (lab, hours) => {
    let c = hours * num(lab.hourly);
    if (num(lab.minCharge) > 0 && hours > 0) c = Math.max(c, num(lab.minCharge));
    return c * (1 + num(lab.markupPct) / 100);
  };
  if (C.includeLabour !== false) {
    (prod.labour || []).forEach(pl => {
      const lab = (cfg.labour || {})[pl.labourId];
      if (!lab) { if (pl.labourId) err('Labour type no longer exists'); return; }
      const hrs = (num(pl.minutesPerUnit) * B[pl.unitBasis || 'item'] + num(pl.setupMinutes)) / 60;
      if (hrs > 0) add('labour', lab.name, fmtN(hrs) + ' h × ' + money(lab.hourly), labCost(lab, hrs));
    });
    if (num(line.extraMinutes) > 0) {
      const lab = (cfg.labour || {})[line.labourId] || (cfg.labour || {})[((prod.labour || [])[0] || {}).labourId];
      if (lab) add('labour', 'Extra labour: ' + lab.name, fmtN(num(line.extraMinutes) / 60) + ' h × ' + money(lab.hourly), labCost(lab, num(line.extraMinutes) / 60));
      else err('Choose a labour type for the extra labour minutes');
    }
  }

  // ---- 6. finishing
  const directSoFar = () => res.lines.filter(l => ['material', 'print', 'machine', 'labour', 'base'].includes(l.group)).reduce((a, l) => a + l.amount, 0);
  if (C.includeFinishing !== false) (line.finishing || []).forEach(sel => {
    const f = (cfg.finishing || {})[sel.id];
    if (!f) { err('A selected finishing option no longer exists'); return; }
    if (f.active === false) warn('Finishing "' + f.name + '" is disabled');
    const qp = f.askQty ? num(sel.qty, num(f.defaultQty, 1)) : 1;
    if (qp < 0) { err(f.name + ': quantity cannot be negative'); return; }
    let amt = 0, detail = '';
    switch (f.method) {
      case 'fixed': amt = num(f.price); detail = 'fixed'; break;
      case 'per_item': amt = num(f.price) * qty * qp; detail = fmtN(qty * qp) + ' × ' + money(f.price); break;
      case 'per_page': amt = num(f.price) * qty * pages * qp; detail = fmtN(qty * pages * qp) + ' pages × ' + money(f.price); break;
      case 'per_sqm': amt = num(f.price) * areaForMat; detail = fmtN(areaForMat) + ' m² × ' + money(f.price); break;
      case 'per_metre': {
        const per = f.metreBasis === 'width' ? wmm / 1000 : f.metreBasis === 'height' ? hmm / 1000 : perimeterM;
        amt = num(f.price) * per * qty * qp; detail = fmtN(per * qty * qp) + ' m × ' + money(f.price); break;
      }
      case 'percent': { const b = directSoFar(); amt = b * num(f.price) / 100; detail = num(f.price) + '% of ' + money(b); break; }
      case 'labour': {
        const lab = (cfg.labour || {})[f.labourId];
        if (!lab) { err(f.name + ': labour type missing'); return; }
        const hrs = num(f.minutes) * qty * qp / 60;
        amt = labCost(lab, hrs); detail = fmtN(hrs) + ' h × ' + money(lab.hourly); break;
      }
      default: err(f.name + ': unknown pricing method'); return;
    }
    if (num(f.setup) > 0) { amt += num(f.setup); detail += ' + setup ' + money(f.setup); }
    if (num(f.minCharge) > 0 && amt < num(f.minCharge)) { amt = num(f.minCharge); detail = 'minimum charge'; }
    add('finishing', f.name, detail, amt);
  });

  // ---- 7. other costs & custom cost
  (prod.otherCosts || []).forEach(o => {
    const q = B[o.basis || 'fixed'];
    add('other', o.label || 'Other cost', fmtN(q) + ' × ' + money(o.amount), num(o.amount) * q);
  });
  if (has(line.customCost) && num(line.customCost) > 0) add('custom', line.customLabel || 'Custom cost', 'entered on quote', num(line.customCost));
  const designFeeAmount = Math.max(0, num(line.designFee));
  const designFeeMode = line.designFeeMode === 'separate' ? 'separate' : 'internal';
  if (designFeeAmount > 0) add(designFeeMode === 'separate' ? 'design_fee' : 'design_internal', designFeeMode === 'separate' ? 'Design fee (customer charge)' : 'Design fee (internal cost)', designFeeMode === 'separate' ? 'separate quote line' : 'internal design cost', designFeeAmount);

  // ---- 8. wastage
  const wpct = has(line.wastagePct) ? num(line.wastagePct) : has(prod.wastagePct) ? num(prod.wastagePct) : num(P.defaultWastagePct, 0);
  if (wpct < 0 || wpct > 100) err('Wastage must be between 0% and 100%');
  if (C.includeWastage !== false && wpct > 0) {
    const g = (grp) => res.lines.filter(l => l.group === grp).reduce((a, l) => a + l.amount, 0);
    const applies = C.wastageAppliesTo || 'materials_print';
    const b = applies === 'materials' ? g('material') : applies === 'direct' ? g('material') + g('print') + g('machine') + g('labour') + g('base') : g('material') + g('print');
    add('wastage', 'Wastage allowance', wpct + '% of ' + money(b) + ' (' + applies.replace('_', ' + ') + ')', b * wpct / 100);
  }

  // ---- honour the on/off switches for whole groups
  const off = { packaging: C.includePackaging === false, other: C.includeOther === false, custom: false };
  res.lines = res.lines.filter(l => !off[l.group]);

/* ===== PrintOps bridge: connects the existing calculator to the management app =====
   The calculator code above is unchanged. This file only (1) receives catalogue/pricing from the host page,
   (2) hides the calculator's own customer card / sidebar, and (3) hands the finished quote back to the host,
   which stores it in PostgreSQL through the save_quote() database function. */
(function () {
  const ORIGIN = window.location.origin;
  const post = (type, payload) => window.parent.postMessage({ source: 'printops-calc', type, payload }, ORIGIN);
  let cur = null;
  let quoteSession = null;
  let quoteDirty = false;
  const calculatorSessions = Object.create(null);

  window.addEventListener('message', ev => {
    if (ev.origin !== ORIGIN) return;
    const m = ev.data; if (!m || m.source !== 'printops-host') return;
    if (m.type === 'init') init(m.payload);
    else if (m.type === 'error') { setBusy(false); toast(m.payload, 'bad'); }
    else if (m.type === 'customer') { cur = m.payload; }
  });

  function setBusy(b) { $$('[data-act="ed-save"]').forEach(x => x.disabled = b); }

  function itemFromDb(row, fresh) {
    const it = JSON.parse(JSON.stringify(row.item || {}));
    it.key = uid('i'); it.productId = it.productId || row.product_id;
    if (fresh) { it.override = null; }
    return it;
  }

  function init(p) {
    quoteSession = null;
    quoteDirty = false;
    Object.keys(calculatorSessions).forEach(k => delete calculatorSessions[k]);
    State.dirty = false;
    State.mode = 'embedded'; State.me = { id: p.userId, name: p.userName, isOwner: true, canEdit: true, canData: true };
    p.settings.demo = false; State.cfg.settings = p.settings;
    ['products', 'materials', 'machines', 'labour', 'finishing', 'categories'].forEach(k => { State.cfg[k] = p[k] || {}; });
    State.loaded.settings = true; State.customers = {}; State.quotes = {}; State.embedded = true; State.audit = [];
    document.body.classList.add('embedded');
    cur = p.customer || null;
    const q = p.quote;
    if (q) {
      const Q = newQuoteDraft();
      Q.customer = { name: q.customerName || (cur && cur.name) || '', company: '', phone: '', email: '' };
      Q.ref = q.reference || ''; Q.notes = q.notes || ''; Q.terms = q.terms || Q.terms; Q.paymentTerms = q.payment_terms || Q.paymentTerms; Q.discount = q.discount && q.discount.type ? q.discount : Q.discount;
      Q.date = q.quote_date || Q.date; Q.expiry = q.valid_until || Q.expiry;
      const snapBox = q.pricing_snapshot || {}; if (snapBox.snap) Q.snap = snapBox.snap; if (snapBox.staffName) Q.staffName = snapBox.staffName;
      if (p.mode === 'edit') {
        Q.id = q.id; Q.number = q.number; Q.status = q.status; Q.version = q.version; Q.createdAt = Date.parse(q.created_at) || 0;
        Q.items = (q.items || []).map(r => itemFromDb(r, false));
        Q.items.forEach(i => { if (!i.calc) recalc(i); });
      } else { // duplicate / repeat order: new quote, prices recalculated with CURRENT pricing, overrides dropped
        Q.copiedFrom = q.number; Q.snap = newQuoteDraft().snap; Q.date = todayISO(); Q.expiry = addDays(Q.date, PQ.num((State.cfg.settings.quotes || {}).expiryDays, 14));
        Q.items = (q.items || []).map(r => itemFromDb(r, true)); Q.items.forEach(recalc);
      }
      State.ed = { kind: 'quote', Q, isNew: !Q.id };
      if (Q.copiedFrom) State.dirty = quoteDirty = true;
      quoteSession = State.ed;
    }
    State.view = p.start === 'calc' ? 'calc' : 'editor'; State.params = p.start === 'calc' ? { profile: 'dtf' } : {};
    buildBar(); render(true);
  }

  function buildBar() {
    if ($('#embedbar')) return;
    const bar = document.createElement('div'); bar.id = 'embedbar';
    bar.innerHTML = [['quote', 'Quote builder'], ['dtf', 'DTF calculator'], ['paper', 'Paper calculator'], ['large', 'Large-format calculator']].map(t => `<button data-bar="${t[0]}">${t[1]}</button>`).join('');
    document.body.insertBefore(bar, $('#app'));
    bar.addEventListener('click', e => {
      const b = e.target.closest('[data-bar]'); if (!b) return; const v = b.dataset.bar;
      if (State.view === 'editor' && State.ed && State.ed.kind === 'quote') { quoteSession = State.ed; quoteDirty = State.dirty; }
      if (State.view === 'calc') calculatorSessions[State.params.profile] = { ed: State.ed, params: State.params };
      if (v === 'quote') {
        State.ed = quoteSession;
        State.view = 'editor'; State.params = {};
        State.dirty = quoteDirty;
      } else {
        const saved = calculatorSessions[v];
        State.ed = saved ? saved.ed : null;
        State.view = 'calc'; State.params = saved ? saved.params : { profile: v };
      }
      render(true);
    });
  }

  /* quote is handed to the host instead of being written to the old claude.ai storage */
  saveQuote = async function () {
    const ed = State.ed; if (!ed || ed.kind !== 'quote') return; const Q = ed.Q, errs = [];
    if (!cur || !cur.id) errs.push('Choose a customer above the calculator first');
    if (!Q.date) errs.push('Quote date is required'); if (Q.expiry && Q.date && Q.expiry < Q.date) errs.push('Expiry date is before the quote date');
    if (!Q.items.length) errs.push('Add at least one line item');
    Q.items.forEach((it, i) => { recalc(it); if (!it.calc.ok) errs.push(`Line ${i + 1}: ${it.calc.errors[0]}`); if (it.override && !(PQ.has(it.override.price) && PQ.num(it.override.price) >= 0)) errs.push(`Line ${i + 1}: enter an override price`); });
    const t = totalsFor(Q); t.errors.forEach(x => errs.push(x));
    if (errs.length) { openModal({ title: 'Please fix before saving', body: `<ul>${errs.map(x => `<li>${e(x)}</li>`).join('')}</ul>`, footer: '<button class="btn primary" data-act="modal-close">OK</button>' }); return; }
    const now = Date.now();
    Q.items.forEach(it => { if (it.override && !it.override.at) it.override = { price: PQ.num(it.override.price), reason: it.override.reason || '', original: it.calc.calculatedPrice, by: State.me.id, at: now }; });
    const payload = {
      quote: { id: Q.id || null, quote_date: Q.date, valid_until: Q.expiry || null, reference: Q.ref || null, notes: Q.notes || null, terms: Q.terms || null, payment_terms: Q.paymentTerms || null,
        discount: Q.discount || {}, pricing_snapshot: { snap: Q.snap, staffName: Q.staffName || '', pricedAt: now }, totals: t, expected_version: Q.version || null, copied_from_number: Q.copiedFrom || null },
      items: Q.items.map(it => { const c = JSON.parse(JSON.stringify(it)); delete c.closed; return {
        product_id: it.productId, product_name: it.productName, category_name: it.categoryName || '', profile: (State.cfg.products[it.productId] || {}).profile || 'general',
        description: it.desc || '', quantity: PQ.num(it.qty), unit_price: PQ.num(it.calc.unitPrice), line_total: PQ.num(it.calc.finalSubtotal), item: c }; })
    };
    setBusy(true); post('save', payload);
  };
  ACT['ed-cancel'] = () => post('cancel');
  document.addEventListener('input', () => { if (!State.dirty) { State.dirty = true; } post('dirty', true); }, { once: true });
  if (window.ResizeObserver) new ResizeObserver(() => post('height', document.documentElement.scrollHeight)).observe(document.body);
  post('ready', true);
})();
