name: Verify Tashmak upgrade build

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "tashmak-upgrade-2/**"
      - ".github/workflows/verify-tashmak-upgrade.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tashmak-upgrade-2
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: sb_publishable_build_check_only
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: tashmak-upgrade-2/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Build Next.js app
        run: npm run build
